# DEMSTA — scalable local / staging stack
version: "3.9"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demsta
      POSTGRES_PASSWORD: demsta
      POSTGRES_DB: demsta
    ports:
      - "5432:5432"
    volumes:
      - demsta_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demsta -d demsta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - demsta_redis:/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://demsta:demsta@db:5432/demsta
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      AUTO_MIGRATE: "true"
      ENABLE_RLS: "true"
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      RATE_LIMIT_ENABLED: "true"
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173
      FRONTEND_ORIGIN: http://localhost:5173
      ENVIRONMENT: development
      OBJECT_STORAGE_PATH: /var/data/object_store
      PORT: "8000"
    volumes:
      - demsta_media:/var/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: ""
    depends_on:
      api:
        condition: service_healthy

volumes:
  demsta_pg:
  demsta_redis:
  demsta_media:
