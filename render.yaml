# DEMSTA — Render Blueprint
# Dashboard → New → Blueprint → connect this repo (path: render.yaml)
#
# After first deploy:
# 1. Copy the API URL (https://demsta-api-XXXX.onrender.com)
# 2. Set frontend env VITE_API_BASE to that URL (no trailing slash)
# 3. Set API env FRONTEND_ORIGIN to the static site URL
# 4. Manual Deploy → Clear build cache & deploy on demsta-web
#
# Free Redis is optional; API falls back to in-process rate limits when REDIS_ENABLED=false.

services:
  - type: web
    name: demsta-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    autoDeploy: true
    disk:
      name: demsta-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTO_MIGRATE
        value: "true"
      - key: ENABLE_RLS
        value: "true"
      - key: REDIS_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ALLOW_DEMO_RESEED
        value: "true"
      - key: SEED_FORCE
        value: "false"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: OBJECT_STORAGE_PATH
        value: /var/data/object_store
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: demsta-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: demsta-web
    runtime: static
    rootDir: frontend
    buildCommand: (npm ci || npm install) && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # Baked into the Vite bundle at build time — set after API has a public URL
      - key: VITE_API_BASE
        sync: false

databases:
  - name: demsta-db
    plan: basic-100mb
    databaseName: demsta
    user: demsta
    postgresMajorVersion: "16"
