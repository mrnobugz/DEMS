<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("demsta-ui");
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var state = parsed && parsed.state ? parsed.state : {};
          var root = document.documentElement;
          if (state.dark) {
            root.classList.add("dark");
            root.style.colorScheme = "dark";
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute("content", "#0a1122");
            var scheme = document.querySelector('meta[name="color-scheme"]');
            if (scheme) scheme.setAttribute("content", "dark");
          }
          if (state.chairside) root.classList.add("chairside");
          if (state.palette === "sky") root.setAttribute("data-palette", "sky");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B5FFF" />
    <meta name="description" content="DEMSTA — Dental Electronic Management System for Treatment & Administration" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@500;600&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>DEMSTA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
